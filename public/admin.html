<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理 | IRODORI弁当</title>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    input[type="date"] { padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button.clear { padding: 8px 12px; background: #aaa; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.pdf { padding: 8px 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.pdf:hover { background: #1a252f; }
    button.menu-toggle { padding: 8px 12px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.menu-toggle:hover { background: #cf6d17; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: #f0f0f0; padding: 10px; text-align: left; border-bottom: 2px solid #ddd; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    button.cancel { padding: 4px 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.cancel:hover { background: #c0392b; }
    button.complete { padding: 4px 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.complete:hover { background: #1e8449; }
    button.completed { padding: 4px 10px; background: #aaa; color: white; border: none; border-radius: 4px; cursor: pointer; }
    tr.done td { opacity: 0.5; }
    #count { margin-bottom: 12px; color: #555; font-size: 0.9rem; }
    @media print {
      .no-print { display: none !important; }
      body { margin: 0; }
    }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #2c2c2c; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999;
      transition: opacity 0.5s;
    }
    #loading .logo { color: #f0a500; font-size: 3rem; margin-bottom: 16px; }
    #loading p { color: #aaa; font-size: 0.9rem; letter-spacing: 0.1em; }
  </style>
</head>
<body>
<div id="loading">
  <div class="logo">🍱</div>
  <p>IRODORI BENTO</p>
</div>
  <h1>予約管理</h1>
  <div class="filters no-print">
    <input type="date" id="date">
    <button class="clear" onclick="clearFilter()">全件表示</button>
    <button class="pdf" onclick="window.print()">PDF出力</button>
    <button class="menu-toggle" onclick="toggleMenuSection()">メニュー管理</button>
  </div>

  <div id="menu-section" style="display:none; margin-bottom:24px; padding:16px; background:#f9f9f9; border-radius:8px;">
    <h2 style="font-size:1rem; margin-bottom:12px;">メニュー管理</h2>
    <table id="menu-table" style="width:100%; border-collapse:collapse; font-size:0.9rem; margin-bottom:16px;">
      <thead>
        <tr>
          <th style="padding:8px; background:#f0f0f0; border-bottom:2px solid #ddd;">名前</th>
          <th style="padding:8px; background:#f0f0f0; border-bottom:2px solid #ddd;">値段</th>
          <th style="padding:8px; background:#f0f0f0; border-bottom:2px solid #ddd;">説明</th>
          <th style="padding:8px; background:#f0f0f0; border-bottom:2px solid #ddd;">上限数</th>
          <th style="padding:8px; background:#f0f0f0; border-bottom:2px solid #ddd;">操作</th>
        </tr>
      </thead>
      <tbody id="menu-tbody"></tbody>
    </table>
    <h3 style="font-size:0.95rem; margin-bottom:8px;">新しいメニューを追加</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="text" id="new-name" placeholder="メニュー名" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
      <input type="number" id="new-price" placeholder="値段" style="padding:6px; border:1px solid #ccc; border-radius:4px; width:80px;">
      <input type="text" id="new-desc" placeholder="説明" style="padding:6px; border:1px solid #ccc; border-radius:4px; flex:1;">
      <input type="number" id="new-max" placeholder="上限数" style="padding:6px; border:1px solid #ccc; border-radius:4px; width:80px;">
      <button onclick="addMenu()" style="padding:6px 12px; background:#e67e22; color:white; border:none; border-radius:4px; cursor:pointer;">追加</button>
    </div>
  </div>
  <div id="count"></div>
  <table>
    <thead>
      <tr>
        <th>番号</th><th>日付</th><th>受取時間</th><th>名前</th>
        <th>電話番号</th><th>メール</th><th>住所</th>
        <th>注文内容</th><th>合計</th><th>完了</th><th class="no-print">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
    dateInput.addEventListener("change", load);

    async function load() {
      const date = dateInput.value;
      const url = date ? "/reservations?date=" + date : "/reservations";
      const res = await fetch(url);
      const rows = await res.json();
      const tbody = document.getElementById("tbody");
      document.getElementById("count").textContent = rows.length + " 件";
      tbody.innerHTML = rows.map(function(r) {
        const itemsText = r.items.map(function(i) { return i.menu_name + "×" + i.quantity; }).join("、");
        const total = r.items.reduce(function(sum, i) { return sum + i.price * i.quantity; }, 0);
        return "<tr class='" + (r.completed ? "done" : "") + "'>" +
          "<td>" + r.id + "</td>" +
          "<td>" + r.date + "</td>" +
          "<td>" + r.pickup_time + "</td>" +
          "<td>" + r.name + "</td>" +
          "<td>" + r.phone + "</td>" +
          "<td>" + r.email + "</td>" +
          "<td>" + r.address + "</td>" +
          "<td>" + itemsText + "</td>" +
          "<td>¥" + total.toLocaleString() + "</td>" +
          "<td><button class='" + (r.completed ? "completed" : "complete") + "' onclick='toggleComplete(" + r.id + ")'>" + (r.completed ? "完了済" : "完了") + "</button></td>" +
          "<td class='no-print'><button class='cancel' onclick='cancel(" + r.id + ")'>キャンセル</button></td>" +
          "</tr>";
      }).join("");
    }

    async function cancel(id) {
      if (!confirm("予約番号 " + id + " をキャンセルしますか？")) return;
      await fetch("/reservations/" + id, { method: "DELETE" });
      load();
    }

    async function toggleComplete(id) {
      await fetch("/reservations/" + id + "/complete", { method: "PATCH" });
      load();
    }

    function clearFilter() {
      dateInput.value = "";
      load();
    }

    function toggleMenuSection() {
      const s = document.getElementById("menu-section");
      s.style.display = s.style.display === "none" ? "block" : "none";
      if (s.style.display === "block") loadMenus();
    }

    async function loadMenus() {
      const res = await fetch("/menus");
      const menus = await res.json();
      document.getElementById("menu-tbody").innerHTML = menus.map(function(m) {
        return "<tr>" +
          "<td><input value='" + m.name + "' id='m-name-" + m.id + "' style='width:100%;padding:4px;border:1px solid #ddd;border-radius:4px;'></td>" +
          "<td><input type='number' value='" + m.price + "' id='m-price-" + m.id + "' style='width:70px;padding:4px;border:1px solid #ddd;border-radius:4px;'></td>" +
          "<td><input value='" + (m.description || "") + "' id='m-desc-" + m.id + "' style='width:100%;padding:4px;border:1px solid #ddd;border-radius:4px;'></td>" +
          "<td><input type='number' value='" + m.max + "' id='m-max-" + m.id + "' style='width:60px;padding:4px;border:1px solid #ddd;border-radius:4px;'></td>" +
          "<td style='white-space:nowrap'>" +
          "<button onclick='updateMenu(" + m.id + ")' style='padding:4px 8px;background:#27ae60;color:white;border:none;border-radius:4px;cursor:pointer;margin-right:4px;'>保存</button>" +
          "<button onclick='deleteMenu(" + m.id + ")' style='padding:4px 8px;background:#e74c3c;color:white;border:none;border-radius:4px;cursor:pointer;'>削除</button>" +
          "</td></tr>";
      }).join("");
    }

    async function updateMenu(id) {
      await fetch("/menus/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("m-name-" + id).value,
          price: document.getElementById("m-price-" + id).value,
          description: document.getElementById("m-desc-" + id).value,
          max: document.getElementById("m-max-" + id).value
        })
      });
      alert("保存しました");
      loadMenus();
    }

    async function deleteMenu(id) {
      if (!confirm("このメニューを削除しますか？")) return;
      await fetch("/menus/" + id, { method: "DELETE" });
      loadMenus();
    }

    async function addMenu() {
      const name = document.getElementById("new-name").value;
      const price = document.getElementById("new-price").value;
      const desc = document.getElementById("new-desc").value;
      const max = document.getElementById("new-max").value;
      if (!name || !price || !max) { alert("名前・値段・上限数は必須です"); return; }
      await fetch("/menus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price, description: desc, max })
      });
      document.getElementById("new-name").value = "";
      document.getElementById("new-price").value = "";
      document.getElementById("new-desc").value = "";
      document.getElementById("new-max").value = "";
      loadMenus();
    }

    load().then(() => {
      const loading = document.getElementById("loading");
      loading.style.opacity = "0";
      setTimeout(() => loading.style.display = "none", 500);
    });
  </script>
</body>
</html>
