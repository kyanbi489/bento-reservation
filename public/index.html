<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRODORI弁当 | お弁当予約</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', sans-serif; background: #faf9f7; color: #333; }
    header { background: #2c2c2c; color: white; text-align: center; padding: 32px 16px; }
    header h1 { font-size: 1.8rem; letter-spacing: 0.1em; }
    header p { margin-top: 8px; color: #aaa; font-size: 0.9rem; }
    .menu-section { max-width: 900px; margin: 48px auto; padding: 0 16px; }
    .menu-section h2 { font-size: 1.2rem; margin-bottom: 24px; text-align: center; letter-spacing: 0.05em; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
    .menu-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border: 2px solid transparent; transition: transform 0.2s, box-shadow 0.2s; }
    .menu-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .menu-card .placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, #f5e6d3, #fad7a0); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .menu-card-body { padding: 16px; }
    .menu-card-body h3 { font-size: 1.1rem; }
    .menu-card-body .price { color: #e67e22; font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
    .menu-card-body .desc { color: #777; font-size: 0.85rem; margin-top: 8px; line-height: 1.5; }
    .menu-card-body .remaining { margin-top: 10px; font-size: 0.8rem; color: #999; }
    .menu-card-body .remaining.low { color: #e74c3c; }
    .qty-control { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .qty-control button { width: 32px; height: 32px; border: 1px solid #ddd; background: white; border-radius: 6px; font-size: 1.1rem; cursor: pointer; }
    .qty-control button:hover { background: #f0f0f0; }
    .qty-control span { font-size: 1rem; min-width: 24px; text-align: center; }
    .form-section { max-width: 560px; margin: 0 auto 64px; padding: 0 16px; }
    .form-section h2 { font-size: 1.2rem; margin-bottom: 24px; text-align: center; letter-spacing: 0.05em; }
    .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 16px; font-size: 0.85rem; color: #555; }
    input { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; background: #fafafa; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #e67e22; background: white; }
    .cart-summary { margin-top: 16px; padding: 12px; background: #fff8f0; border-radius: 8px; border: 1px solid #fad7a0; font-size: 0.9rem; display: none; }
    .cart-summary .total { font-size: 1.1rem; font-weight: bold; color: #e67e22; margin-top: 8px; }
    button[type="submit"] { margin-top: 24px; width: 100%; padding: 14px; background: #e67e22; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; letter-spacing: 0.05em; transition: background 0.2s; }
    button[type="submit"]:hover { background: #cf6d17; }
    #message { margin-top: 16px; padding: 14px; border-radius: 8px; text-align: center; display: none; font-size: 0.95rem; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    footer { text-align: center; padding: 32px; color: #aaa; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <div style="font-size:0.85rem; color:#f0a500; letter-spacing:0.1em; margin-bottom:8px;">🍱 IRODORI BENTO</div>
  <h1>IRODORI弁当</h1>
  <p>旬の食材を使った彩り豊かなお弁当をお届けします</p>
</header>

<section class="menu-section">
  <h2>— メニュー —</h2>
  <div class="menu-grid" id="menu-grid"></div>
</section>

<section class="form-section">
  <h2>— ご予約フォーム —</h2>
  <div id="hours-banner" style="display:none; background:#fff3cd; color:#856404; padding:12px; border-radius:8px; text-align:center; margin-bottom:16px; font-size:0.9rem;">
    現在は受付時間外です（受付時間：9:00〜14:00）
  </div>
  <div class="form-card">
    <form id="form">
      <div class="cart-summary" id="cart-summary"></div>
      <label>日付
        <input type="date" id="date" required>
      </label>
      <label>受取時間（9:00〜14:00）
        <input type="time" id="pickup_time" min="09:00" max="14:00" required>
      </label>
      <label>お名前
        <input type="text" id="name" placeholder="田中 太郎" required>
      </label>
      <label>電話番号
        <input type="tel" id="phone" placeholder="090-1234-5678" required>
      </label>
      <label>メールアドレス
        <input type="email" id="email" placeholder="example@mail.com" required>
      </label>
      <label>配達先住所
        <input type="text" id="address" placeholder="札幌市〇〇区〇〇1-2-3" required>
      </label>
      <button type="submit">予約する</button>
    </form>
    <div id="message"></div>
  </div>
</section>

<footer>
  <p>IRODORI弁当</p>
  <p style="margin-top:8px;">〒003-0026　札幌市白石区本通12丁目8-23　1F</p>
  <p style="margin-top:4px;">TEL：<a href="tel:011-826-6078" style="color:#aaa;">011-826-6078</a></p>
  <p style="margin-top:8px;">© IRODORI弁当</p>
</footer>

<script>
  let menus = [];
  let quantities = {};

  const dateInput = document.getElementById("date");
  const today = new Date().toISOString().split("T")[0];
  dateInput.value = today;
  dateInput.min = today;

  function checkBusinessHours() {
    const now = new Date();
    const h = now.getHours();
    if (h < 9 || h >= 14) {
      document.getElementById("hours-banner").style.display = "block";
      document.querySelector("button[type='submit']").disabled = true;
      document.querySelector("button[type='submit']").style.opacity = "0.5";
    }
  }
  checkBusinessHours();

  function updateCart() {
    const summary = document.getElementById("cart-summary");
    const items = menus.filter(m => quantities[m.id] > 0);
    if (items.length === 0) { summary.style.display = "none"; return; }
    const total = items.reduce((sum, m) => sum + m.price * quantities[m.id], 0);
    summary.style.display = "block";
    summary.innerHTML = items.map(m => `<div>${m.name} × ${quantities[m.id]}個</div>`).join("") +
      `<div class="total">合計：¥${total.toLocaleString()}</div>`;
  }

  async function loadMenus() {
    const date = dateInput.value;
    const [menuRes, availRes] = await Promise.all([
      fetch("/menus"),
      fetch(`/availability?date=${date}`)
    ]);
    menus = await menuRes.json();
    const avail = await availRes.json();
    menus.forEach(m => { if (quantities[m.id] === undefined) quantities[m.id] = 0; });

    const grid = document.getElementById("menu-grid");
    grid.innerHTML = menus.map(m => {
      const a = avail.find(a => a.id === m.id);
      const remaining = a ? a.remaining : 0;
      const soldOut = remaining === 0;
      const low = remaining > 0 && remaining <= 5;
      return `
        <div class="menu-card" style="${soldOut ? 'opacity:0.5' : ''}">
          <div class="placeholder">🍱</div>
          <div class="menu-card-body">
            <h3>${m.name}</h3>
            <div class="price">¥${m.price.toLocaleString()}</div>
            <div class="desc">${m.description || ""}</div>
            <div class="remaining ${low ? 'low' : ''}">${soldOut ? '売り切れ' : `残り${remaining}個`}</div>
            ${soldOut ? '' : `
            <div class="qty-control">
              <button type="button" onclick="changeQty(${m.id}, -1)">−</button>
              <span id="qty-${m.id}">${quantities[m.id]}</span>
              <button type="button" onclick="changeQty(${m.id}, 1)">＋</button>
            </div>`}
          </div>
        </div>`;
    }).join("");
  }

  function changeQty(id, delta) {
    const menu = menus.find(m => m.id === id);
    quantities[id] = Math.max(0, (quantities[id] || 0) + delta);
    document.getElementById(`qty-${id}`).textContent = quantities[id];
    updateCart();
  }

  dateInput.addEventListener("change", loadMenus);
  loadMenus();

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const items = menus.filter(m => quantities[m.id] > 0).map(m => ({ menu_id: m.id, quantity: quantities[m.id] }));
    if (items.length === 0) {
      const msg = document.getElementById("message");
      msg.style.display = "block";
      msg.className = "error";
      msg.textContent = "メニューを選択してください";
      return;
    }
    const body = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      address: document.getElementById("address").value,
      date: document.getElementById("date").value,
      pickup_time: document.getElementById("pickup_time").value,
      items
    };
    const res = await fetch("/reservations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const msg = document.getElementById("message");
    msg.style.display = "block";
    if (res.ok) {
      const data = await res.json();
      msg.className = "success";
      msg.textContent = `ご予約ありがとうございます（予約番号：${data.id}）`;
      document.getElementById("form").reset();
      menus.forEach(m => quantities[m.id] = 0);
      document.getElementById("cart-summary").style.display = "none";
      dateInput.value = today;
      loadMenus();
    } else {
      const data = await res.json();
      msg.className = "error";
      msg.textContent = `エラー：${data.error}`;
    }
  });
</script>
</body>
</html>
